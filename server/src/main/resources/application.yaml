spring:
  application:
    name: coffee-shop-server

  datasource:
    url: jdbc:postgresql://localhost:5432/coffee
    username: myuser
    password: ilovecoffee

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

  profiles:
    active:
      - local
  web:
    error:
      include-message: never
server:
  servlet:
    context-path: /apis

security:
  jwt:
    ttl: PT3H
